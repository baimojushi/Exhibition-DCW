[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hp-upload-ref"
version = "0.1.0"
description = "Reference implementation for durable dual-WebSocket chunk upload"
requires-python = ">=3.11"
dependencies = [
  "websocket-client>=1.9,<2",
  "websockets>=16,<18",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
hp-upload-server = "hp_upload_ref.server:main"
hp-upload-client = "hp_upload_ref.cli_client:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
